<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniPick - Your Partner in University Admissions</title>
    <link rel="icon" type="image/png" href="/images/unipick-favicon.png" />
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured error:', e.message, e.filename, e.lineno);
        fetch('http://localhost:3001/log-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, error: e.error ? e.error.stack : null })
        }).catch(console.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('http://localhost:3001/log-error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: e.reason ? e.reason.stack || e.reason.message : 'Unhandled Rejection' })
        }).catch(console.error);
      });
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/chat-widget.css" />
    <link rel="stylesheet" href="/css/callback-widget.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
